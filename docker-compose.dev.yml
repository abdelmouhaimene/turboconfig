services:
  postgres:
    image: postgres:17-alpine
    container_name: turboconfig-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-turboconfig}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-turboconfig_secret}
      POSTGRES_DB: ${DATABASE_NAME:-turboconfig_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-turboconfig} -d ${DATABASE_NAME:-turboconfig_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: turboconfig-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-dev:
  redis-data-dev:
